name: Release Main PKG

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Build app bundle
        run: |
          pyinstaller --name "ClipClop" \
            --windowed \
            --icon="icon.icns" \
            --osx-bundle-identifier "com.inventure71.clipclop" \
            --add-data="icon.icns:." \
            --hidden-import="pyperclip" \
            --hidden-import="netifaces" \
            --hidden-import="rumps" \
            --hidden-import="cryptography" \
            --hidden-import="qrcode" \
            --hidden-import="PIL" \
            menubar_app.py

      - name: Mark app as menu bar only
        run: |
          plist="dist/ClipClop.app/Contents/Info.plist"
          if /usr/libexec/PlistBuddy -c "Print :LSUIElement" "$plist" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Set :LSUIElement true" "$plist"
          else
            /usr/libexec/PlistBuddy -c "Add :LSUIElement bool true" "$plist"
          fi

      - name: Build installer package
        run: |
          pkgbuild \
            --component dist/ClipClop.app \
            --install-location /Applications \
            --identifier com.inventure.clipclop \
            ClipClop.pkg

      - name: Rename release asset
        run: mv ClipClop.pkg ClipClop-mac.pkg

      - name: Move rolling release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f main-build "$GITHUB_SHA"
          git push --force origin refs/tags/main-build

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes_file="$RUNNER_TEMP/release-notes.txt"
          {
            echo "Rolling macOS build from ClipClop main."
            echo
            echo "Source repo: $GITHUB_REPOSITORY"
            echo "Source commit: $GITHUB_SHA"
          } > "$notes_file"

          if gh release view main-build >/dev/null 2>&1; then
            gh release upload main-build ClipClop-mac.pkg --clobber
            gh release edit main-build --title "main" --notes-file "$notes_file"
          else
            gh release create main-build ClipClop-mac.pkg \
              --title "main" \
              --notes-file "$notes_file" \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
